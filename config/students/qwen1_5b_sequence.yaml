# Student: Qwen2.5-1.5B, signal: sequence (CE against teacher's own generated tokens)
teacher_model: "Qwen/Qwen2.5-7B-Instruct"
student_model: "Qwen/Qwen2.5-1.5B-Instruct"

temperature: 2.0
alpha: 0.3

batch_size: 2
gradient_accumulation_steps: 8
max_length: 512
num_epochs: 3
learning_rate: 2.0e-5
warmup_steps: 100
weight_decay: 0.01
seed: 42

dataset_name: "tatsu-lab/alpaca"
num_samples: 10000
data_dir: "data"
split_a_ratio: 0.5

top_k_logits: 1000
capability_eval_samples: 200

num_gpus: 1
device: "cuda"

run_log: "runs/qwen1_5b_sequence_run_log.jsonl"
checkpoint_dir: "checkpoints/sequence/qwen1_5b"
