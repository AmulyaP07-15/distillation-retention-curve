# Student: Qwen2.5-1.5B, signal: logit (KL against teacher's top-k logits)
teacher_model: "Qwen/Qwen2.5-7B-Instruct"
student_model: "Qwen/Qwen2.5-1.5B-Instruct"

temperature: 2.0
alpha: 0.3

# Smaller micro-batch than the 0.5B config, larger accumulation to keep the
# same effective batch size of 16. The 1.5B logit cell peaked at 32.63GB on a
# 32GB V100 at batch_size 2, right at the card's limit, so this is lowered
# further to batch_size 1. Paired with gradient checkpointing in the logit
# trainer itself (src/trainer.py).
batch_size: 1
gradient_accumulation_steps: 16
max_length: 512
num_epochs: 3
learning_rate: 2.0e-5
warmup_steps: 100
weight_decay: 0.01
seed: 42

dataset_name: "tatsu-lab/alpaca"
num_samples: 10000
data_dir: "data"
split_a_ratio: 0.5

top_k_logits: 1000
capability_eval_samples: 200

num_gpus: 1
device: "cuda"

run_log: "runs/qwen1_5b_logit_run_log.jsonl"
checkpoint_dir: "checkpoints/logit/qwen1_5b"
student_torch_dtype: "float32"
