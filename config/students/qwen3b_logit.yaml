# Student: Qwen2.5-3B, signal: logit (KL against teacher's top-k logits)
teacher_model: "Qwen/Qwen2.5-7B-Instruct"
student_model: "Qwen/Qwen2.5-3B-Instruct"

temperature: 2.0
alpha: 0.3

# Smallest micro-batch of the three students, largest accumulation, same
# effective batch size of 16.
batch_size: 1
gradient_accumulation_steps: 16
max_length: 512
num_epochs: 3
learning_rate: 2.0e-5
warmup_steps: 100
weight_decay: 0.01
seed: 42

dataset_name: "tatsu-lab/alpaca"
num_samples: 10000
data_dir: "data"
split_a_ratio: 0.5

top_k_logits: 1000
capability_eval_samples: 200

num_gpus: 1
device: "cuda"

run_log: "runs/qwen3b_logit_run_log.jsonl"
checkpoint_dir: "checkpoints/logit/qwen3b"
