# Student: Qwen2.5-3B, signal: sequence (CE against teacher's own generated tokens)
teacher_model: "Qwen/Qwen2.5-7B-Instruct"
student_model: "Qwen/Qwen2.5-3B-Instruct"

temperature: 2.0
alpha: 0.3

# Already at batch_size 1, the floor, so unlike the 1.5B sequence config
# there's no further room to trade batch_size for gradient_accumulation_steps
# here. Fitting this cell relies on gradient checkpointing in the sequence
# trainer itself (see src/sequence_trainer.py).
batch_size: 1
gradient_accumulation_steps: 16
max_length: 512
num_epochs: 3
learning_rate: 2.0e-5
warmup_steps: 100
weight_decay: 0.01
seed: 42

dataset_name: "tatsu-lab/alpaca"
num_samples: 10000
data_dir: "data"
split_a_ratio: 0.5

top_k_logits: 1000
capability_eval_samples: 200

num_gpus: 1
device: "cuda"

run_log: "runs/qwen3b_sequence_run_log.jsonl"
checkpoint_dir: "checkpoints/sequence/qwen3b"

# Same fp32 static-memory ceiling as qwen3b_logit.yaml applies here too:
# weights + gradients + AdamW moments for a 3B model is ~48GB in fp32
# regardless of batch_size or gradient checkpointing, since neither of
# those touch anything but activation memory. bfloat16 halves it to ~24GB.
# Requires the target GPU to support bf16 (A100 does, V100 does not).
student_torch_dtype: "bfloat16"
